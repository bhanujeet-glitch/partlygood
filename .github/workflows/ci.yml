name: publication-quality

on:
  push:
    branches: [main]
  pull_request:

# Sets permissions for GitHub Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy to Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Structural validation
        run: python scripts/validate_content.py --strict
      - name: Quality gate
        run: python scripts/quality_checks.py --all
      - name: Production build (strict)
        run: python -m mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
